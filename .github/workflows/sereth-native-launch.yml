name: Sereth native overworld launch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sereth-native-launch.yml'
      - 'tests/native_sereth_release_smoke.gd'
      - 'docs/audits/sereth-neutral-assembly.sha256'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'game/title_screen.gd'
      - 'game/profile_store.gd'
      - 'game/campaign_*.gd'
      - 'game/overworld/**'
      - 'assets/overworld/**'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_RELEASE: 4.7.2-stable
      EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify all five reviewed neutral inputs on the checked-out source
        shell: bash
        run: sha256sum --check --strict docs/audits/sereth-neutral-assembly.sha256
      - name: Install verified matching Godot editor and Linux templates
        run: |
          asset="https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v$GODOT_RELEASE"
          curl --fail --silent --show-error --location --retry 2 --max-time 180 "$asset"_linux.x86_64.zip -o "$RUNNER_TEMP/editor.zip"
          curl --fail --silent --show-error --location --retry 2 --max-time 420 "$asset"_export_templates.tpz -o "$RUNNER_TEMP/templates.tpz"
          printf '%s  %s\n' "$EDITOR_SHA256" "$RUNNER_TEMP/editor.zip" "$TEMPLATES_SHA256" "$RUNNER_TEMP/templates.tpz" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot"
          export_dir="$HOME/.local/share/godot/export_templates/${GODOT_RELEASE/-/.}"
          mkdir -p "$export_dir"
          for flavor in debug release; do
            unzip -p "$RUNNER_TEMP/templates.tpz" "templates/linux_$flavor.x86_64" > "$export_dir/linux_$flavor.x86_64"
            test -s "$export_dir/linux_$flavor.x86_64"
            chmod 0755 "$export_dir/linux_$flavor.x86_64"
          done
          rm "$RUNNER_TEMP/editor.zip" "$RUNNER_TEMP/templates.tpz"
          "$RUNNER_TEMP/godot" --version
      - name: Build disposable nondebug release without changing the stock switch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCI'
          from pathlib import Path
          path = Path("project.godot")
          text = path.read_text()
          marker = "[autoload]\n"
          assert text.count(marker) == text.count("sereth_3d_overworld=true") == 1
          for id in ("mara", "ilyra", "sova", "raska"):
              assert text.count(f"{id}_3d_overworld=true") == 1, id
          path.write_text(text.replace(marker, marker+'NativeSerethSmoke="*res://tests/native_sereth_release_smoke.gd"\n'))
          PYCI
          "$RUNNER_TEMP/godot" --headless --import
          "$RUNNER_TEMP/godot" --headless --script res://tests/sereth_overworld_normal_title.gd
          "$RUNNER_TEMP/godot" --headless --script res://tests/sereth_neutral_release_contract.gd
          mkdir -p "$RUNNER_TEMP/sereth-bin" "$RUNNER_TEMP/sereth-away"
          "$RUNNER_TEMP/godot" --headless --export-release "Linux x86_64" "$RUNNER_TEMP/sereth-bin/torn-asunder.x86_64"
          test -x "$RUNNER_TEMP/sereth-bin/torn-asunder.x86_64"
          test ! -e "$RUNNER_TEMP/sereth-bin/torn-asunder.pck"
      - name: Run only the finished executable outside source, with separate cold saves
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sereth-away"
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_SHADER_CACHE_DISABLE=true LP_NUM_THREADS=2
          app="$RUNNER_TEMP/sereth-bin/torn-asunder.x86_64"
          seed() {
            export XDG_DATA_HOME="$1" XDG_CONFIG_HOME="$1"
            local waypoint="$2" clears="$3"
            p="$XDG_DATA_HOME/godot/app_userdata/Torn Asunder/profile.cfg"
            mkdir -p "$(dirname "$p")"
            cat > "$p" <<CFG
          [campaigns]
          sereth=1
          [campaign_waypoints]
          sereth="$waypoint"
          [mission_progress]
          sereth=PackedStringArray($clears)
          [settings]
          fullscreen=false
          reduced_motion=false
          CFG
          }
          proof() {
            local mode="$1" log="$RUNNER_TEMP/sereth-$1.log"
            shift
            SERETH_NATIVE_MODE="$mode" "$@" 2>&1 | tee "$log"
            grep -F "Native Sereth executable smoke ($mode): PASS" "$log"
            grep -F "pressing actual Quit Game" "$log"
            if grep -E '^(FAIL:|SCRIPT ERROR:|ERROR:)' "$log"; then exit 1; fi
          }
          finale='"sereth_voices_at_the_cut", "sereth_pass_writ"'
          seed "$RUNNER_TEMP/sereth-off" cairnspine_assembly "$finale"
          proof off timeout 100s "$app" --headless --audio-driver Dummy
          seed "$RUNNER_TEMP/sereth-cut" still_kingdom_cut ""
          proof cut xvfb-run -a timeout 150s "$app" --audio-driver Dummy --windowed --resolution 960x540
          seed "$RUNNER_TEMP/sereth-keeper" cairnspine_boundary_post '"sereth_voices_at_the_cut"'
          proof keeper xvfb-run -a timeout 150s "$app" --audio-driver Dummy --windowed --resolution 960x540
          seed "$RUNNER_TEMP/sereth-year-five" cairnspine_assembly "$finale"
          proof year-five xvfb-run -a timeout 150s "$app" --audio-driver Dummy --windowed --resolution 960x540
