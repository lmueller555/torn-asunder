name: Raska native overworld launch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/raska-native-launch.yml'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'game/title_screen.gd'
      - 'game/profile_store.gd'
      - 'game/campaign_*.gd'
      - 'game/overworld/**'
      - 'assets/overworld/**'
      - 'tests/native_raska_release_smoke.gd'
      - 'tests/raska_normal_overworld.gd'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_RELEASE: 4.7.2-stable
      EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified matching Godot editor and Linux templates
        run: |
          asset="https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v$GODOT_RELEASE"
          curl --fail --silent --show-error --location --retry 2 --max-time 180 "$asset"_linux.x86_64.zip -o "$RUNNER_TEMP/editor.zip"
          curl --fail --silent --show-error --location --retry 2 --max-time 420 "$asset"_export_templates.tpz -o "$RUNNER_TEMP/templates.tpz"
          printf '%s  %s\n' "$EDITOR_SHA256" "$RUNNER_TEMP/editor.zip" "$TEMPLATES_SHA256" "$RUNNER_TEMP/templates.tpz" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot"
          export_dir="$HOME/.local/share/godot/export_templates/${GODOT_RELEASE/-/.}"
          mkdir -p "$export_dir"
          for flavor in debug release; do
            unzip -p "$RUNNER_TEMP/templates.tpz" "templates/linux_$flavor.x86_64" > "$export_dir/linux_$flavor.x86_64"
            test -s "$export_dir/linux_$flavor.x86_64"
            chmod 0755 "$export_dir/linux_$flavor.x86_64"
          done
          rm "$RUNNER_TEMP/editor.zip" "$RUNNER_TEMP/templates.tpz"
          "$RUNNER_TEMP/godot" --version
      - name: Build a disposable copy of the actual release candidate
        run: |
          # Do not alter the release defaults, main scene, or campaign profile.
          python3 - <<'PYCI'
          from pathlib import Path
          p = Path("project.godot")
          raw = p.read_text()
          autoload = "[autoload]\n"
          assert raw.count(autoload) == raw.count("raska_3d_overworld=true") == 1
          p.write_text(raw.replace(autoload, autoload + 'NativeRaskaSmoke="*res://tests/native_raska_release_smoke.gd"\n'))
          PYCI
          "$RUNNER_TEMP/godot" --headless --import
          "$RUNNER_TEMP/godot" --headless --script res://tests/raska_normal_overworld.gd
          mkdir -p "$RUNNER_TEMP/raska-bin" "$RUNNER_TEMP/away-from-source" "$RUNNER_TEMP/raska-off" "$RUNNER_TEMP/raska-active"
          "$RUNNER_TEMP/godot" --headless --export-release "Linux x86_64" "$RUNNER_TEMP/raska-bin/torn-asunder.x86_64"
          test -x "$RUNNER_TEMP/raska-bin/torn-asunder.x86_64"
          test ! -e "$RUNNER_TEMP/raska-bin/torn-asunder.pck"
      - name: Verify normal launch, saved crossing, and explicit opt-out
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/away-from-source"
          app="$RUNNER_TEMP/raska-bin/torn-asunder.x86_64"
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_SHADER_CACHE_DISABLE=true LP_NUM_THREADS=2
          export XDG_DATA_HOME="$RUNNER_TEMP/raska-off" XDG_CONFIG_HOME="$RUNNER_TEMP/raska-off"
          RASKA_SMOKE_MODE=default_off timeout 85s "$app" --headless 2>&1 | tee "$RUNNER_TEMP/raska-off.log"
          grep -F 'Native Raska launch smoke (default_off): PASS' "$RUNNER_TEMP/raska-off.log"
          export XDG_DATA_HOME="$RUNNER_TEMP/raska-active" XDG_CONFIG_HOME="$RUNNER_TEMP/raska-active"
          RASKA_SMOKE_MODE=travel timeout 130s "$app" --headless 2>&1 | tee "$RUNNER_TEMP/raska-travel.log"
          grep -F 'Native Raska launch smoke (travel): PASS' "$RUNNER_TEMP/raska-travel.log"
          RASKA_SMOKE_MODE=rendered RASKA_SMOKE_SCREEN="$RUNNER_TEMP/raska-well-native.jpg" xvfb-run -a timeout 100s             "$app" --audio-driver Dummy --windowed --resolution 960x540 2>&1 | tee "$RUNNER_TEMP/raska-rendered.log"
          grep -F 'Native Raska launch smoke (rendered): PASS' "$RUNNER_TEMP/raska-rendered.log"
          test -s "$RUNNER_TEMP/raska-well-native.jpg"
          if grep -E '^(FAIL:|SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP"/raska-{off,travel,rendered}.log; then exit 1; fi
      - name: Cold Raska North victory coda and one-time acknowledgement
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/away-from-source"
          app="$RUNNER_TEMP/raska-bin/torn-asunder.x86_64"
          export XDG_DATA_HOME="$RUNNER_TEMP/raska-coda" XDG_CONFIG_HOME="$RUNNER_TEMP/raska-coda"
          mkdir -p "$XDG_DATA_HOME"
          for mode in coda_unread coda_read; do
            RASKA_SMOKE_MODE="$mode" timeout 115s "$app" --headless 2>&1 | tee "$RUNNER_TEMP/raska-$mode.log"
            grep -F "Native Raska launch smoke ($mode): PASS" "$RUNNER_TEMP/raska-$mode.log"
          done
          if grep -E '^(FAIL:|SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP"/raska-coda_{unread,read}.log; then exit 1; fi
