name: Godot smoke tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Run Godot headless smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      GODOT_RELEASE: 4.7.2-stable
      # Official asset digest: https://github.com/godotengine/godot-builds/releases/expanded_assets/4.7.2-stable
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify Godot
        run: |
          binary="Godot_v${GODOT_RELEASE}_linux.x86_64"
          archive="$RUNNER_TEMP/$binary.zip"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 90 \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/$binary.zip" \
            --output "$archive"
          printf '%s  %s\n' "$GODOT_SHA256" "$archive" | sha256sum --check --strict
          unzip -q "$archive" "$binary" -d "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$binary" "$RUNNER_TEMP/godot"
          "$RUNNER_TEMP/godot" --version
      - name: Import project headlessly
        run: '"$RUNNER_TEMP/godot" --headless --import'
      - name: Run campaign, battlefield and combat smoke tests
        run: |
          for test in campaign_missions mara_greyhollow_rescue greyhollow_cinematic_presentation sereth_cut_command_minimap minimap_route_overlay ilyra_headland_relay_skin cairnspine_perimeter_march battle_points; do
            echo "::group::$test"
            "$RUNNER_TEMP/godot" --headless --script "res://tests/$test.gd"
            echo "::endgroup::"
          done
