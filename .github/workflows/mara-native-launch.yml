name: Mara native overworld launch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mara-native-launch.yml'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'game/title_screen.gd'
      - 'game/profile_store.gd'
      - 'game/campaign_*.gd'
      - 'game/overworld/**'
      - 'assets/overworld/**'
      - 'tests/native_mara_release_smoke.gd'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_RELEASE: 4.7.2-stable
      EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified matching Godot editor and Linux templates
        run: |
          asset="https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v$GODOT_RELEASE"
          curl --fail --silent --show-error --location --retry 2 --max-time 180 "$asset"_linux.x86_64.zip -o "$RUNNER_TEMP/editor.zip"
          curl --fail --silent --show-error --location --retry 2 --max-time 420 "$asset"_export_templates.tpz -o "$RUNNER_TEMP/templates.tpz"
          printf '%s  %s\n' "$EDITOR_SHA256" "$RUNNER_TEMP/editor.zip" "$TEMPLATES_SHA256" "$RUNNER_TEMP/templates.tpz" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot"
          export_dir="$HOME/.local/share/godot/export_templates/${GODOT_RELEASE/-/.}"
          mkdir -p "$export_dir"
          for flavor in debug release; do
            unzip -p "$RUNNER_TEMP/templates.tpz" "templates/linux_$flavor.x86_64" > "$export_dir/linux_$flavor.x86_64"
            test -s "$export_dir/linux_$flavor.x86_64"
            chmod 0755 "$export_dir/linux_$flavor.x86_64"
          done
          rm "$RUNNER_TEMP/editor.zip" "$RUNNER_TEMP/templates.tpz"
          "$RUNNER_TEMP/godot" --version
      - name: Import and export a disposable release candidate
        run: |
          # Add only the test driver in this disposable checkout. Do not use --script,
          # replace the main scene, or opt into a debug-only campaign switch.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("project.godot")
          project = path.read_text()
          marker = "[autoload]\n"
          assert project.count(marker) == 1
          path.write_text(project.replace(marker, marker + 'NativeMaraSmoke="*res://tests/native_mara_release_smoke.gd"\n'))
          PY
          "$RUNNER_TEMP/godot" --headless --import
          mkdir -p "$RUNNER_TEMP/mara-native" "$RUNNER_TEMP/away-from-source" "$RUNNER_TEMP/mara-nocache"
          "$RUNNER_TEMP/godot" --headless --export-release "Linux x86_64" "$RUNNER_TEMP/mara-native/torn-asunder.x86_64"
          test -x "$RUNNER_TEMP/mara-native/torn-asunder.x86_64"
      - name: Launch the release app outside the checkout
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/away-from-source"
          for mode in new continue; do
            echo "::group::$mode"
            xvfb-run -a env XDG_DATA_HOME="$RUNNER_TEMP/mara-nocache" \
              XDG_CONFIG_HOME="$RUNNER_TEMP/mara-nocache" LIBGL_ALWAYS_SOFTWARE=1 \
              MESA_SHADER_CACHE_DISABLE=true TORN_RELEASE_SMOKE_MODE="$mode" \
              timeout 90s "$RUNNER_TEMP/mara-native/torn-asunder.x86_64" --audio-driver Dummy --windowed --resolution 960x540 \
              2>&1 | tee "$RUNNER_TEMP/mara-$mode.log"
            grep -F "Native Mara release smoke ($mode): PASS" "$RUNNER_TEMP/mara-$mode.log"
            echo "::endgroup::"
          done
